# Compila el APK de Android y lo publica como Release descargable.
name: APK Android

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renombrar APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk "build/euler-notes-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: euler-notes-apk
          path: app/build/euler-notes-*.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Euler Notes v${{ env.VERSION }} (Android)
          prerelease: true
          files: app/build/euler-notes-*.apk
          body: |
            APK para Android. Descárgalo desde el celular o la tablet e instálalo
            (permite "instalar apps de origen desconocido").

            La app necesita el backend corriendo en un PC de la misma red WiFi:
            `cd backend && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000`
            y en la app, icono de servidor → `http://IP-DEL-PC:8000`.
