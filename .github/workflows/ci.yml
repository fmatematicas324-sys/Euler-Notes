# Integración continua: pruebas del backend y de la app, y APK de comprobación.
# No publica releases. Si existen los secretos ANDROID_*, el APK se firma con la
# clave estable de Euler Notes y se instala encima de la versión anterior; si
# no, con una clave debug temporal (ver docs/SIGNING.md, ADR 15).
name: CI

on:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Coherencia de versiones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 tool/check_versions.py

  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: pytest
        run: pytest -q

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Generar código (Drift)
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  apk:
    name: APK de comprobación
    needs: [versions, backend, flutter]
    # Cuando release.yml reutiliza este workflow, el APK lo compila release.yml.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generar código (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Clave de firma (secretos)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin secretos de firma: el APK se firma con una clave debug temporal y no se podrá instalar encima de otra compilación (docs/SIGNING.md)."
            exit 0
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/euler-notes-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/euler-notes-upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Compilar APK
        run: flutter build apk --release

      - name: Huella del certificado del APK
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256" || true
          fi

      - name: Borrar la clave del runner
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/euler-notes-upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: euler-notes-apk-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
