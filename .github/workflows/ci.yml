# Integración continua: pruebas del backend y de la app, y APK de comprobación.
# No publica releases ni usa secretos. El APK se firma con la clave debug
# temporal del runner y solo sirve para pruebas (ver docs/SIGNING.md).
name: CI

on:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Coherencia de versiones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 tool/check_versions.py

  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: pytest
        run: pytest -q

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  apk:
    name: APK de comprobación
    needs: [versions, backend, flutter]
    # Cuando release.yml reutiliza este workflow, el APK lo compila release.yml.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      # Solo lectura: deja constancia en el log de qué contiene el APK de prueba.
      - name: Inspeccionar APK
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          set -euo pipefail
          APK=app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "== Tamaño y SHA-256"
          ls -l "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "== Paquete, versión y SDK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label):"
          echo "== Manifiesto: copias de seguridad"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" \
            | grep -E "allowBackup|fullBackupContent|dataExtractionRules" || echo "(sin atributos de backup)"
          echo "== Reglas de backup compiladas"
          for res in backup_rules data_extraction_rules; do
            path=$("$BT/aapt2" dump resources "$APK" | grep -A2 "xml/$res" | grep -oE "res/[^ ]+\.xml" | head -1)
            echo "-- xml/$res -> $path"
            "$BT/aapt2" dump xmltree --file "$path" "$APK"
          done
          echo "== Firma"
          "$BT/apksigner" verify --print-certs "$APK"
          echo "== Interfaz del token (cadenas en el código AOT)"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            n=$(unzip -p "$APK" "lib/$abi/libapp.so" | strings | grep -c -E "Token de acceso|server-token|/auth/check" || true)
            echo "$abi: $n coincidencias"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: euler-notes-apk-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
          retention-days: 7
          if-no-files-found: error
