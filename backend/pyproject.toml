[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euler-notes-backend"
version = "0.4.0"
description = "Backend local de Euler Notes (FastAPI + SymPy + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sympy>=1.13",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "networkx>=3.3",
    "pypdf>=5.0",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
]

# Solo el paquete `app`: `data/` (base de datos, PDF, token) y `tests/` no se
# empaquetan. Sin esto, setuptools falla en cuanto existe `data/` en el equipo.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
