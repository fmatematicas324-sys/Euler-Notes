[project]
name = "cuaderno-backend"
version = "0.1.0"
description = "Backend local de Cuaderno Científico (FastAPI + SymPy + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sympy>=1.13",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "networkx>=3.3",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
